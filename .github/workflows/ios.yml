name: Build

on:
  push:
    branches: [main, 'dev/**', 'ios12-compat-test']
    tags: ['v*']
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:

  # ───────── 1. ПАТЧЕННЫЙ COMPOSE → m2 ─────────
  compose-m2:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - name: Checkout compose fork
        uses: actions/checkout@v4
        with:
          repository: alwex0920/compose-multiplatform-core
          ref: jb-main
          path: compose-multiplatform-core
          fetch-depth: 1

      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4

      - name: Restore m2 cache
        id: cache-m2
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.konan
          key: compose-ios12-m2-${{ hashFiles('compose-multiplatform-core/gradle.properties', 'compose-multiplatform-core/build.gradle', 'compose-multiplatform-core/gradle/libs.versions.toml') }}
          restore-keys: compose-ios12-m2-

      - name: Publish iOS-12 Compose to Maven Local
        if: steps.cache-m2.outputs.cache-hit != 'true'
        working-directory: compose-multiplatform-core
        env:
          COMPOSE_CUSTOM_VERSION: 1.0.0-ios12
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew \
            :compose:runtime:runtime:publishToMavenLocal \
            :compose:runtime:runtime-saveable:publishToMavenLocal \
            :compose:ui:ui:publishToMavenLocal \
            :compose:ui:ui-geometry:publishToMavenLocal \
            :compose:ui:ui-graphics:publishToMavenLocal \
            :compose:ui:ui-text:publishToMavenLocal \
            :compose:ui:ui-unit:publishToMavenLocal \
            :compose:ui:ui-util:publishToMavenLocal \
            :compose:foundation:foundation:publishToMavenLocal \
            :compose:foundation:foundation-layout:publishToMavenLocal \
            :compose:material:material:publishToMavenLocal \
            :compose:material3:material3:publishToMavenLocal \
            :compose:animation:animation:publishToMavenLocal \
            --stacktrace 2>&1 | tee publish.log

      - name: Verify m2
        run: |
          echo "=== androidx/compose/ui/ui ==="
          ls ~/.m2/repository/androidx/compose/ui/ui/ 2>/dev/null || echo "(none)"
          echo "=== iOS klibs ==="
          COUNT=$(find ~/.m2/repository -name "*.klib" 2>/dev/null | wc -l)
          echo "count: $COUNT"
          [ "$COUNT" -ge 10 ] || { echo "::error::Compote publish failed, klibs=$COUNT"; exit 1; }

      - name: Pack m2
        run: tar -czf m2-ios12.tar.gz -C ~/.m2/repository .

      - uses: actions/upload-artifact@v4
        with:
          name: m2-ios12-repo
          path: m2-ios12.tar.gz
          retention-days: 7

  # ───────── 2. ANDROID CI (lint, тесты, APK) ─────────
  ci-android:
    needs: compose-m2
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/download-artifact@v4
        with: { name: m2-ios12-repo, path: ./tmp-m2 }
      - run: |
          mkdir -p ~/.m2/repository
          tar -xzf ./tmp-m2/m2-ios12.tar.gz -C ~/.m2/repository/
          rm -rf ./tmp-m2

      - run: chmod +x gradlew

      - name: Compile Kotlin (iOS klib + Android)
        run: |
          set -o pipefail
          ./gradlew :core:compileKotlinIosArm64 :ui:compileKotlinIosArm64 \
                    compileLiteDebugKotlin compileFullDebugKotlin --continue 2>&1 | tee gradle-out.log

      - name: Lint + Unit tests
        run: |
          set -o pipefail
          ./gradlew lintLiteDebug testLiteDebugUnitTest 2>&1 | tee -a gradle-out.log

      - name: Build APKs
        run: |
          set -o pipefail
          ./gradlew assembleLiteDebug assembleFullDebug assembleLiteRelease assembleFullRelease --continue 2>&1 | tee -a gradle-out.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-debug
          path: app/build/outputs/apk/*/debug/*.apk
          if-no-files-found: warn
          retention-days: 7

      - name: Report errors
        if: failure()
        run: |
          grep -E "(^e: |error:|What went wrong|FAILED)" gradle-out.log | head -60 || true

  # ───────── 3. iOS IPA (без подписи, link-maps) ─────────
  build-ios:
    needs: compose-m2
    if: |
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[ipa]') ||
      startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/download-artifact@v4
        with: { name: m2-ios12-repo, path: ./tmp-m2 }
      - run: |
          mkdir -p ~/.m2/repository
          tar -xzf ./tmp-m2/m2-ios12.tar.gz -C ~/.m2/repository/
          rm -rf ./tmp-m2

      - run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: iosApp
        run: xcodegen generate

      - name: Build app
        run: |
          set -o pipefail
          mkdir -p link-maps
          chmod +x gradlew
          xcodebuild \
            -project iosApp/SoundCloud.xcodeproj -scheme SoundCloud \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            LD_GENERATE_MAP_FILE=YES \
            'LD_MAP_FILE_PATH=$(PROJECT_DIR)/../link-maps/$(PRODUCT_NAME)-$(CURRENT_ARCH).txt' \
            build 2>&1 | tee xcode-out.log | grep -E "error|warning: unable|BUILD" || true
          test -d build/ios/Build/Products/Release-iphoneos/SoundCloud.app

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-link-map
          path: link-maps/*.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Report errors
        if: failure()
        run: |
          grep -E "(^e: |error:|What went wrong|FAILED)" xcode-out.log | head -60 || true

  # ───────── 4. RELEASE (по тегу v*) ─────────
  release:
    needs: compose-m2
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/download-artifact@v4
        with: { name: m2-ios12-repo, path: ./tmp-m2 }
      - run: |
          mkdir -p ~/.m2/repository
          tar -xzf ./tmp-m2/m2-ios12.tar.gz -C ~/.m2/repository/
          rm -rf ./tmp-m2

      - run: |
          chmod +x gradlew
          brew install xcodegen ldid

      - name: Check tag matches versionName
        run: |
          VERSION="$(grep -m1 'val appVersionName' app/build.gradle.kts | sed -E 's/.*"(.*)".*/\1/')"
          TAG="${GITHUB_REF_NAME#v}"
          [ "$VERSION" = "$TAG" ] || { echo "::error::Tag $GITHUB_REF_NAME != versionName $VERSION"; exit 1; }

      - name: Generate Xcode project
        working-directory: iosApp
        run: xcodegen generate

      - name: Build app
        run: |
          set -o pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          CODE="$(grep -m1 'val appVersionCode' app/build.gradle.kts | grep -o '[0-9][0-9]*')"
          xcodebuild \
            -project iosApp/SoundCloud.xcodeproj -scheme SoundCloud \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$CODE" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee xcode-out.log | grep -E "error|warning: unable|BUILD" || true
          test -d build/ios/Build/Products/Release-iphoneos/SoundCloud.app

      - name: Package IPA and TIPA
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          APP=build/ios/Build/Products/Release-iphoneos/SoundCloud.app
          ldid -SiosApp/SoundCloud.entitlements "$APP/SoundCloud"
          rm -rf Payload dist && mkdir Payload dist && cp -R "$APP" Payload/
          zip -qry "dist/SoundCloud-iOS-v$VERSION.ipa" Payload
          cp "dist/SoundCloud-iOS-v$VERSION.ipa" "dist/SoundCloud-iOS-v$VERSION.tipa"
          cd dist && shasum -a 256 *.ipa *.tipa > SHA256SUMS.txt && cd ..

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.ipa
            dist/*.tipa
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
