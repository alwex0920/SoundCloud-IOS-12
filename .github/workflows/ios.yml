name: iOS

on:
  workflow_dispatch:
  push:
    branches: [dev/ios, main, ios12-compat-test]

permissions:
  contents: read

jobs:
  ipa:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[ipa]')
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Restore Kotlin and Xcode build caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.konan
            build/ios
          key: ios12-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/*.kt', '**/*.kts', 'iosApp/project.yml') }}
          restore-keys: |
            ios12-${{ runner.os }}-

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # ─────────── НОВОЕ: патченный Compose под iOS 12 ───────────
      - name: Download patched Compose Maven repo
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.COMPOSE_REPO_TOKEN }}
          repo: alwex0920/compose-multiplatform-core
          workflow: build-ios12.yml
          workflow_conclusion: success
          name: m2-ios12-repo
          path: ./tmp-m2

      - name: Unpack m2 into ~/.m2
        run: |
          set -euo pipefail
          mkdir -p ~/.m2/repository
          tar -xzf ./tmp-m2/m2-ios12.tar.gz -C ~/.m2/repository/
          rm -rf ./tmp-m2
          echo "=== m2 size ==="
          du -sh ~/.m2/repository
          echo "=== androidx/compose modules ==="
          ls ~/.m2/repository/androidx/compose/ 2>/dev/null | head -20 || echo "(none)"
          echo "=== org/jetbrains/compose modules ==="
          ls ~/.m2/repository/org/jetbrains/compose/ 2>/dev/null | head -20 || echo "(none)"
          echo "=== ui versions (androidx) ==="
          ls ~/.m2/repository/androidx/compose/ui/ui/ 2>/dev/null || echo "(none)"
          echo "=== ui versions (jetbrains) ==="
          ls ~/.m2/repository/org/jetbrains/compose/ui/ui/ 2>/dev/null || echo "(none)"
          echo "=== iOS klibs count ==="
          find ~/.m2/repository -name "*.klib" 2>/dev/null | wc -l
      # ─────────── /НОВОЕ ───────────

      - name: Tools
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: iosApp
        run: xcodegen generate

      - name: Build app
        run: |
          set -o pipefail
          mkdir -p link-maps
          chmod +x gradlew
          xcodebuild \
            -project iosApp/SoundCloud.xcodeproj \
            -scheme SoundCloud \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            LD_GENERATE_MAP_FILE=YES \
            'LD_MAP_FILE_PATH=$(PROJECT_DIR)/../link-maps/$(PRODUCT_NAME)-$(CURRENT_ARCH).txt' \
            build 2>&1 | tee xcode-out.log | grep -E "error|warning: unable|BUILD" || true
          test -d build/ios/Build/Products/Release-iphoneos/SoundCloud.app

      - name: Collect Link Map
        run: |
          mkdir -p link-maps
          find build/ios -type f -iname '*linkmap*.txt' -print -exec cp -n {} link-maps/ \; || true
          echo "Collected Link Map files:"
          find link-maps -maxdepth 1 -type f -print -exec ls -lh {} \;
          test -n "$(find link-maps -maxdepth 1 -type f -name '*.txt' -print -quit)"
      - uses: actions/upload-artifact@v4
        with:
          name: ios-link-map
          path: link-maps/*.txt
          if-no-files-found: error
          retention-days: 14

      - name: Report build errors
        if: failure()
        run: |
          python3 - <<'PY'
          import re
          text = ''
          for f in ['xcode-out.log']:
              try:
                  lines = open(f, encoding='utf-8', errors='replace').read().splitlines()
              except FileNotFoundError:
                  continue
              picked = []
              for i, l in enumerate(lines):
                  if re.search(r'(^e: |error:|What went wrong|FAILED)', l):
                      picked.append(l)
                      if 'Exception during generating code' in l or 'What went wrong' in l:
                          picked.extend(lines[i + 1:i + 6])
              picked = [re.sub(r'file://\S*?/(app|core|ui)/src/(\w+)/(kotlin|java)/com/scd/android/', r'\1/\2/', l) for l in picked]
              text += '\n'.join(dict.fromkeys(picked))
          text = text[:120000] or 'no error lines captured'
          esc = lambda t: t.replace('%', '%25').replace('\r', '').replace('\n', '%0A')
          chunks = [text[k:k + 4000] for k in range(0, len(text), 4000)]
          for n, c in enumerate(chunks[:30]):
              kind = ['error', 'warning', 'notice'][n // 10]
              print('::' + kind + ' title=iOS build ' + str(n + 1) + '::' + esc(c))
          PY
